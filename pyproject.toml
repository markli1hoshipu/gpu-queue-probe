[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-queue-probe"
version = "0.1.0"
description = "Bounded Slurm GPU queue latency probes with a GitHub Pages dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mark Li"}]

[project.scripts]
gpu-queue-probe = "gpu_queue_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
